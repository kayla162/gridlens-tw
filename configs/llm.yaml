# 線上生成要打哪一家。值必須是 providers 底下的一個鍵，填別的會在建 runtime 時就失敗，
# 不會默默退回某個預設 —— 打錯 provider 名字而服務照常啟動是最難查的那種錯。
provider: gmi

max_attempts: 3
request_timeout_seconds: 30

# 頂層這兩個是 providers 沒寫時的退路，維持舊設定檔也能運作。
model_env: OPENAI_MODEL
default_model: gpt-5.4-mini

# 每家一段。四個欄位決定怎麼打：
#
#   api        responses 是 OpenAI 自家的 /v1/responses；chat_completions 是業界相容
#              的那個。第三方講「OpenAI 相容」指的幾乎都是後者，所以只換 base_url
#              而不換端點會直接 404。
#   base_url   留空表示用 SDK 自己的預設（也就是 OpenAI 官方）。
#   structured_output
#              對方吃不吃 strict 的 json_schema。關掉之後輸出格式只剩 prompt 裡的要求，
#              靠 parse_generated_query 的寬容解析接住；生出來的東西一樣要過 SqlGuard，
#              所以放寬的是格式保證，不是安全。
#   temperature
#              null 表示不送這個參數。OpenAI 的 reasoning 模型不吃它，而 Llama 這類
#              模型的預設不是 0 —— 同一個問句每次生出不同 SQL，評測會失去意義。
providers:
  openai:
    api: responses
    base_url: null
    api_key_env: OPENAI_API_KEY
    model_env: OPENAI_MODEL
    default_model: gpt-5.4-mini
    structured_output: true
    temperature: null

  gmi:
    api: chat_completions
    base_url: https://api.gmi-serving.com/v1
    api_key_env: GMI_API_KEY
    model_env: GMI_MODEL
    # 換模型從 GMI 的 model catalog 挑，或用 GMI_MODEL 環境變數覆蓋。
    default_model: meta-llama/Llama-3.3-70B-Instruct
    # GMI 文件沒有明寫支不支援 strict json_schema。接上去第一次呼叫若回 400，
    # 把這裡改成 false 再試 —— 那是格式保證的退路，不是安全的退路。
    structured_output: true
    temperature: 0

  # 本機的 Ollama（https://ollama.com），不需要 API key，也不連外網。
  # 用法：`ollama pull qwen3:8b`，再設環境變數 POWERQUERY_LLM_PROVIDER=ollama 啟動服務。
  # 換模型用 OLLAMA_MODEL。Ollama 的 OpenAI 相容端點支援 json_schema 輸出格式。
  ollama:
    api: chat_completions
    base_url: http://127.0.0.1:11434/v1
    requires_api_key: false
    api_key_env: OLLAMA_API_KEY
    model_env: OLLAMA_MODEL
    default_model: qwen3:8b
    structured_output: true
    temperature: 0
    # 本機模型慢：這台筆電上 qwen3:8b 生成一句即時 SQL 實測約 2 分鐘。
    request_timeout_seconds: 300
    # 關掉 qwen3 的推理（thinking）：CP-088 的評測裡 7 題推理停不下來，900 秒都寫不完。
    # Ollama 0.40 的 OpenAI 相容端點認 reasoning_effort: none（think: false 不認）；
    # 實測同一個問題 161 秒、2432 tokens → 18 秒、327 tokens。
    extra_body:
      reasoning_effort: none
